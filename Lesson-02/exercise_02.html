<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex02</title>
</head>
<body>
    <b>This text is bold</b>
    <br>
    <i>This text is italic</i>
    <p><i>Сайн</i> хүн байх хэцүү.</p>
    <p>Сайн <i>хүн</i> байх хэцүү.</p>
    <p>Сайн хүн <i>байх</i> хэцүү.</p>
    <p>Сайн хүн байх <i>хэцүү</i>.</p>
    <p>This is <sub>subscript</sub> and <sup>superscript</sup></p>
    <p title="World Health Organization."The WHO was founded in 1948>WHO</p>
    <p>Би онгоцоор <del>мөлхөх</del> <ins>нисэх</ins> дуртай.</p>
    <p>Энэ бол <mark>тэмдэглэгдсэн</mark> текст юм.</p>
    <p>x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>
</body>
</html>
