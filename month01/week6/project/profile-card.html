<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE CARD</title>
    <link rel="stylesheet" href="profile-card.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-container">
                <div class="wave-group">
                    <img src="./image/Vector 1.png" class="wave">
                    <img src="./image/Vector 2.png" class="wave">
                    <img src="./image/Vector 3.png" class="wave">
                    <img src="./image/Vector 5.png" class="wave">
                    <img src="./image/Vector 6.png" class="wave">
                    <img src="./image/Vector 7.png" class="wave">
                </div>
                <div class="profile-img-container"><img src="./image/Ellipse 1.png" alt="profile" class="profile-img">
                </div>
            </div>
        </div>
        <div class="content">
            <h2 class="name">Johnny Rogers</h2>
            <p class="username">@johnyrogers</p>
            <div class="icons">
                <img src="./image/ic_baseline-facebook.png" alt="facebook">
                <img src="./image/Vector.png" alt="linkedin">
                <img src="./image/simple-icons_x.png" alt="twitter">
                <img src="./image/ri_instagram-fill.png" alt="instagram">
                <img src="./image/icon-park-outline_dribble.png" alt="basketball">
            </div>
            <p class="desc">
                Crafting brand and communication strategies, creating visual designs, leading art direction, and
                capturing
                portraits through photography.
            </p>
        </div>
        <div class="buttons">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>
    </div>
    </div>
    </div>

</body>

</html>
